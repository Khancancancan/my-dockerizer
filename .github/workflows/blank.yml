name: 打包 sandbox 镜像

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        default: 'v1.11.0'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - run: |
          TAG="${{ inputs.tag }}"
          for t in "$TAG" "${TAG#v}"; do
            if docker pull "ghcr.io/agent-infra/sandbox:$t"; then
              docker tag "ghcr.io/agent-infra/sandbox:$t" agent-infra-sandbox:"$TAG"
              docker save --format docker agent-infra-sandbox:"$TAG" | gzip > "sandbox_${TAG}.tar.gz"
              split -b 2G -d "sandbox_${TAG}.tar.gz" "sandbox_${TAG}.tar.gz.part"
              exit 0
            fi
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-parts
          path: sandbox_*.tar.gz.part*
          retention-days: 30
