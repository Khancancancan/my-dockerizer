name: 打包 sandbox 镜像

on:
  workflow_dispatch:

env:
  REPO: https://github.com/agent-infra/sandbox.git
  TAG: v1.11.0
  IMAGE: agent-infra-sandbox:v1.11.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        run: git clone --depth 1 --branch "$TAG" "$REPO" src
        
      - name: 构建镜像
        run: |
          cd src
          mapfile -t dfs < <(find . -type f -name 'Dockerfile*' -size +10c | sort)
          if [ "${#dfs[@]}" -eq 0 ]; then
            echo "没找到非空 Dockerfile"; exit 1
          fi
          echo "候选："
          printf '%s\n' "${dfs[@]}"
          f="${dfs[0]}"
          echo "使用 $f 构建"
          docker build -f "$f" -t "$IMAGE" "$(dirname "$f")"

      - name: 导出 tar.gz
        run: docker save "$IMAGE" | gzip > sandbox_v1.11.0.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-image-tar
          path: sandbox_v1.11.0.tar.gz
          retention-days: 30
