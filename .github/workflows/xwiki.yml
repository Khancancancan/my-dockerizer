name: Ferry Pull (内网摆渡)

on:
  workflow_dispatch:
    inputs:
      xwiki_tag:
        description: 'XWiki 官方镜像 tag (见 hub.docker.com/_/xwiki/tags)'
        default: '17.10.12-mysql-tomcat'
      mysql_tag:
        description: 'MySQL 镜像 tag'
        default: '8.4'

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull images
        run: |
          docker pull "xwiki:${{ inputs.xwiki_tag }}"
          docker pull "mysql:${{ inputs.mysql_tag }}"

      - name: Verify XWiki image content
        run: |
          docker run --rm --entrypoint sh "xwiki:${{ inputs.xwiki_tag }}" -c '
            set -e
            test -f /usr/local/tomcat/webapps/ROOT/WEB-INF/web.xml
            ARTIFACT=$(printenv | sed -n "s/^[A-Z]*_JDBC_ARTIFACT=//p")
            test -n "$ARTIFACT"
            ls "/usr/local/tomcat/webapps/ROOT/WEB-INF/lib/$ARTIFACT" > /dev/null
            /opt/libreoffice/program/soffice --version
          '

      - name: Save images as tar.gz
        run: |
          docker save "xwiki:${{ inputs.xwiki_tag }}" | gzip > "xwiki-${{ inputs.xwiki_tag }}.tar.gz"
          docker save "mysql:${{ inputs.mysql_tag }}" | gzip > "mysql-${{ inputs.mysql_tag }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferry-images
          path: '*.tar.gz'
          retention-days: 7
